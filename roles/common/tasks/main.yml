---
- name: Update apt package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - unzip
      - ca-certificates
      - htop
    state: present