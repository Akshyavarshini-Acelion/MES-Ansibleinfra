---
- name: Pull MongoDB Docker image
  become: true
  community.docker.docker_image:
    name: "{{ mongodb_image }}"
    source: pull

- name: Create MongoDB Docker volume
  become: true
  community.docker.docker_volume:
    name: "{{ mongodb_volume_name }}"

- name: Run MongoDB container
  become: true
  community.docker.docker_container:
    name: "{{ mongodb_container_name }}"
    image: "{{ mongodb_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ mongodb_port }}:27017"
    volumes:
      - "{{ mongodb_volume_name }}:/data/db"
    env:
      MONGO_INITDB_ROOT_USERNAME: "{{ mongodb_root_username }}"
      MONGO_INITDB_ROOT_PASSWORD: "{{ mongodb_root_password }}"

- name: Wait for MongoDB
  become: true
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ mongodb_port }}"
    timeout: 60

- name: Verify MongoDB container
  become: true
  community.docker.docker_container_info:
    name: "{{ mongodb_container_name }}"
  register: mongodb_container

- name: Display MongoDB status
  ansible.builtin.debug:
    msg: "MongoDB container is {{ mongodb_container.container.State.Status }}"
